version: "3.9"

services:
  backend:
    image: recaudo-back
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - app-network

  frontend:
    image: recaudo
    build:
      context: ../recaudo_frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"      # Angular servido por Nginx
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
