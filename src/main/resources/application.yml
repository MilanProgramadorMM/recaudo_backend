server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /api

spring:
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000       # 30s para obtener conexión del pool
      idle-timeout: 600000            # 10min antes de cerrar conexión idle
      max-lifetime: 1800000           # 30min vida máxima de una conexión
      keepalive-time: 60000           # ping cada 60s para mantener viva la conexión
      connection-test-query: SELECT 1  # query de validación
    driver-class-name: com.mysql.cj.jdbc.Driver
    #Local
    #url: jdbc:mysql://localhost:3306/recaudo?serverTimezone=UTC
    #username: root
    #password:
    #para docker
    # url: jdbc:postgresql://host.docker.internal:3306/recaudo?serverTimezone=UTC
    #username: recaudoapp
    #password: R3c4uD0-DB
    #prod
    url: jdbc:mysql://159.203.163.185:3306/recaudo?serverTimezone=America/Bogota
    username: recaudoapp
    password: R3c4uD0-DB
    #url: jdbc:mysql://localhost:3306/credimax?serverTimezone=UTC
    #username: root
    #password:

  servlet:
    multipart:
      max-file-size: 10MB
      enabled: true
      max-request-size: 15MB
      file-size-threshold: 2KB
  jpa:
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
  mvc:
    pathmatch:
      matching-strategy: ant-path-matcher

